name: Github Actions CI
run-name: Running CI on ${{ github.event_name }}
on:
  pull_request:
    branches: [main]
  workflow_call:
    

jobs:
  run-linter-and-type-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync packages
        run: uv sync --locked --dev
      
      - name: Run linter
        run: uv run ruff check .
      
      - name: Run type checker
        run: uv run pyrefly check .


  run-tests:
    runs-on: ubuntu-latest
    needs: run-linter-and-type-checker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync packages
        run: uv sync --locked --dev

      - name: Run tests with coverage reports
        run: uv run pytest --cov=app --cov-report=xml --cov-report=html

      - name: Upload Artifact # Can't run as separate job as each job is running on a new Github-hosted VM.
        uses: actions/upload-artifact@v4
        with:
          path: coverage.xml
          retention-days: 30

  smoke-tests:
      runs-on: ubuntu-latest
      needs: run-tests
      steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run smoke tests on /health, /predict and /dashboard/predict
        run: |
          docker build -t ml-ops .
          docker run -d -p 80:80 ml-ops
          sleep 30          # Wait for the container to start
          
          # Test /health
          response=$(curl -sS --fail http://localhost:80/health)
          echo "$response" | jq -e '.status == "ok"'

          # Test /predict
          status=$(curl -s -o /dev/null -w '%{http_code}' \
          --header "Content-Type: application/json" \
          --request POST \
          --data '{"sex": 0.1, "age": 0.1, "bmi": 0.1, "bp": 0.1, "s1": 0.1, "s2": 0.1, "s3": 0.1, "s4": 0.1, "s5": 0.1, "s6": 0.1}' \
          http://localhost:80/predict)
          [ "$status" = "200" ]

          # Test /dashboard/predict
          status=$(curl -s -o /dev/null -w '%{http_code}' \
          --header "Content-Type: application/json" \
          --request POST \
          --data '{"nurse_id": "smoketest-123", "patient_id": "smoketest-123", "values": {"age": 0.1, "sex": 0.1, "bmi": 0.1, "bp": 0.1, "s1": 0.1, "s2": 0.1, "s3": 0.1, "s4": 0.1, "s5": 0.1, "s6": 0.1}}' \
          http://localhost:80/dashboard/predict)
          [ "$status" = "200" ]