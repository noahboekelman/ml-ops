name: GitHub Actions CI/CD
run-name: Running CI and CD
on:
  push:
    branches: [main]


jobs:
  ci:
    uses: ./.github/workflows/ci.yaml # First we ensure that CI is running before CD
  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noahboekelman/ml-ops

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/noahboekelman/ml-ops:${{ github.sha }}
          annotations: ${{ steps.meta.outputs.annotations }} # metadata
          provenance: true
          sbom: true