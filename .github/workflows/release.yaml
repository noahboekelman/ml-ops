name: GitHub Actions CI/CD for Releases
run-name: Running CI/CD and Release
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml # First we ensure that CI is running before release
  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noahboekelman/ml-ops
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }} # ghcr.io/noahboekelman/ml-ops:v0.1 and :latest
          annotations: ${{ steps.meta.outputs.annotations }} # metadata
          provenance: true
          sbom: true
  release:
    needs: build # Only publishes a release if the image made it to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to execute the git commands for the releaese
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync packages
        run: uv sync --locked

      - name: Train model to get the metrics for this tag
        run: uv run python -m app.model

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file CHANGELOG.md app/model_store/metrics.json