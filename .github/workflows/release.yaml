name: GitHub Actions CI/CD for Releases
run-name: Running CI/CD and Release
on:
  push:
    tags: ['v*']

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml # First we ensure that CI is running before release
  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/noahboekelman/ml-ops
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }} # ghcr.io/noahboekelman/ml-ops:1.0.0 and :1.0 and :latest
          annotations: ${{ steps.meta.outputs.annotations }} # metadata
          provenance: true
          sbom: true